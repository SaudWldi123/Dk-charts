<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DK Charts</title><script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script><style>body{margin:0;background:#131722;color:#fff;font-family:Arial}header{padding:12px;background:#1e222d;display:flex;gap:8px;overflow:auto}button{padding:8px 12px;border:0;border-radius:6px;background:#2a2e39;color:#fff}button.active{background:#2962ff}#chart{height:85vh}</style></head><body><header><button class="active" onclick="load('BTCUSDT')">BTC</button><button onclick="load('ETHUSDT')">ETH</button><button onclick="load('XAUUSDT')">GOLD</button></header><div id="chart"></div><script>const el=document.getElementById('chart');const chart=LightweightCharts.createChart(el,{layout:{background:{color:'#131722'},textColor:'#ccc'}});const candle=chart.addCandlestickSeries();async function load(sym){const r=await fetch('https://api.binance.com/api/v3/klines?symbol='+sym+'&interval=1h&limit=300');const d=await r.json();candle.setData(d.map(k=>({time:k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4]})))}load('BTCUSDT');</script></body></html>
